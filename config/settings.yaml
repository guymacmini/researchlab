# ResearchLab Configuration File
# This file contains default settings that can be overridden by environment variables

app:
  name: "ResearchLab"
  version: "0.1.0"
  environment: "development"  # development, testing, staging, production
  debug: false
  
  # Server settings
  host: "0.0.0.0"
  port: 8000
  
  # Security
  secret_key: "dev-secret-key-change-in-production"
  access_token_expire_minutes: 1440  # 24 hours
  
  # CORS settings
  cors_origins:
    - "http://localhost:3000"
    - "http://localhost:8080"
    - "http://127.0.0.1:3000"
  
  # Logging
  log_level: "INFO"  # DEBUG, INFO, WARNING, ERROR, CRITICAL
  log_format: "json"  # json or console
  log_file: "logs/researchlab.log"
  log_max_size: "100MB"
  log_backup_count: 5

database:
  # PostgreSQL settings
  host: "localhost"
  port: 5432
  name: "researchlab"
  user: "postgres"
  password: ""
  
  # Connection pool settings
  pool_size: 10
  max_overflow: 20
  pool_timeout: 30
  pool_recycle: 3600
  
  # Redis settings
  redis_url: "redis://localhost:6379/0"
  redis_timeout: 5
  redis_retry_on_timeout: true

api:
  # Financial data APIs
  finnhub:
    api_key: ""
    base_url: "https://finnhub.io/api/v1"
    rate_limit: 60  # requests per minute
    timeout: 30
  
  alpha_vantage:
    api_key: ""
    base_url: "https://www.alphavantage.co"
    rate_limit: 5  # requests per minute
    timeout: 30
  
  sec_edgar:
    base_url: "https://data.sec.gov"
    rate_limit: 10  # requests per second
    user_agent: "ResearchLab/0.1.0 (contact@example.com)"
  
  # LLM APIs
  anthropic:
    api_key: ""
    base_url: "https://api.anthropic.com"
    timeout: 60
    max_retries: 3
  
  openai:
    api_key: ""
    base_url: "https://api.openai.com"
    timeout: 60
    max_retries: 3
  
  # Google services
  google:
    credentials_file: null
    sheets_timeout: 30
    drive_timeout: 30

agents:
  # Default LLM settings
  default_model: "claude-3-sonnet-20240229"
  max_tokens: 4000
  temperature: 0.1
  top_p: 0.9
  
  # Agent-specific models
  models:
    research_director: "claude-3-sonnet-20240229"
    fundamental_analyst: "claude-3-sonnet-20240229"
    sentiment_analyst: "claude-3-haiku-20240307"  # Faster model for sentiment
    risk_analyst: "claude-3-sonnet-20240229"
    supply_chain_analyst: "claude-3-sonnet-20240229"
    quantitative_analyst: "claude-3-sonnet-20240229"
  
  # Execution settings
  max_concurrent_agents: 5
  agent_timeout_seconds: 300  # 5 minutes
  max_retries: 3
  retry_delay: 2  # seconds
  
  # Confidence thresholds
  confidence_thresholds:
    min: 0.3
    medium: 0.6
    high: 0.8
    very_high: 0.9

workflow:
  # Research workflow settings
  max_concurrent_workflows: 3
  default_timeout_minutes: 60
  checkpoint_timeout_minutes: 30
  
  # HITL (Human-in-the-Loop) settings
  hitl:
    enabled: true
    auto_approve_high_confidence: false  # Always require human approval
    notification_channels:
      - "email"
      - "slack"
    approval_timeout_hours: 24

monitoring:
  # Performance monitoring
  metrics:
    enabled: true
    port: 9090
    path: "/metrics"
    include_request_duration: true
    include_database_metrics: true
  
  # Health checks
  health:
    enabled: true
    path: "/health"
    include_database: true
    include_redis: true
    include_external_apis: true
  
  # Alerts
  alerts:
    enabled: true
    email_recipients:
      - "admin@example.com"
    slack_webhook: null
    error_threshold: 10  # errors per minute
    latency_threshold: 1000  # milliseconds

security:
  # Rate limiting
  rate_limit:
    enabled: true
    requests_per_minute: 100
    burst_size: 20
  
  # API key validation
  api_key_validation:
    enabled: true
    required_apis:
      - "finnhub"
      - "alpha_vantage"
      - "anthropic"
  
  # Request validation
  request_validation:
    max_request_size: "10MB"
    allowed_content_types:
      - "application/json"
      - "text/plain"
      - "multipart/form-data"

cache:
  # Caching configuration
  redis:
    default_ttl: 3600  # 1 hour
    max_connections: 20
  
  # Cache TTL by data type (seconds)
  ttl:
    stock_data: 300      # 5 minutes
    news_data: 1800      # 30 minutes
    sec_filings: 86400   # 24 hours
    analysis_results: 3600  # 1 hour
    user_sessions: 86400    # 24 hours

# Environment-specific overrides
environments:
  development:
    app:
      debug: true
      log_level: "DEBUG"
    database:
      name: "researchlab_dev"
    agents:
      max_concurrent_agents: 2  # Lower for development
  
  testing:
    app:
      environment: "testing"
      log_level: "WARNING"
    database:
      name: "researchlab_test"
    agents:
      agent_timeout_seconds: 60  # Shorter for tests
  
  production:
    app:
      debug: false
      log_level: "INFO"
      secret_key: "${SECRET_KEY}"  # Must be set via environment
    database:
      host: "${DB_HOST}"
      password: "${DB_PASSWORD}"
    api:
      finnhub:
        api_key: "${FINNHUB_API_KEY}"
      alpha_vantage:
        api_key: "${ALPHA_VANTAGE_API_KEY}"
      anthropic:
        api_key: "${ANTHROPIC_API_KEY}"
    security:
      rate_limit:
        requests_per_minute: 1000  # Higher for production
    monitoring:
      alerts:
        enabled: true