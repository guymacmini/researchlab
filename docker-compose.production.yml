# Production Docker Compose configuration for ResearchLab
# Usage: docker-compose -f docker-compose.production.yml up -d

version: '3.8'

services:
  # Main application
  app:
    build:
      context: .
      dockerfile: Dockerfile.production
      target: production
    image: researchlab:latest
    container_name: researchlab-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # Application settings
      - ENVIRONMENT=production
      - DEBUG=false
      - WORKERS=4
      - USE_GUNICORN=true
      
      # Database configuration
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=researchlab_prod
      - DB_USER=researchlab
      - DB_PASSWORD=${DB_PASSWORD}
      
      # Redis configuration
      - REDIS_URL=redis://redis:6379/0
      
      # API Keys (from environment)
      - SECRET_KEY=${SECRET_KEY}
      - FINNHUB_API_KEY=${FINNHUB_API_KEY}
      - ALPHA_VANTAGE_API_KEY=${ALPHA_VANTAGE_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      
      # Google Sheets (optional)
      - GOOGLE_CREDENTIALS_FILE=${GOOGLE_CREDENTIALS_FILE:-}
      
      # Monitoring
      - METRICS_ENABLED=true
      - HEALTH_ENABLED=true
      - ALERTS_ENABLED=true
      
      # Rate limiting
      - RATE_LIMIT_ENABLED=true
      - REQUESTS_PER_MINUTE=1000
      
      # Logging
      - LOG_LEVEL=info
      - LOG_FORMAT=json
    
    volumes:
      - app_logs:/app/logs
      - app_data:/app/data
      # Mount Google credentials if provided
      - ${GOOGLE_CREDENTIALS_PATH:-/dev/null}:${GOOGLE_CREDENTIALS_FILE:-/dev/null}:ro
    
    networks:
      - researchlab_network
    
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # PostgreSQL database
  postgres:
    image: postgres:15-alpine
    container_name: researchlab-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=researchlab_prod
      - POSTGRES_USER=researchlab
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_INITDB_ARGS=--encoding=UTF8 --locale=C
    
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    
    networks:
      - researchlab_network
    
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U researchlab -d researchlab_prod"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    
    # Security: don't expose port in production
    # Only internal container access

  # Redis cache
  redis:
    image: redis:7-alpine
    container_name: researchlab-redis
    restart: unless-stopped
    command: >
      redis-server 
      --appendonly yes 
      --maxmemory 512mb 
      --maxmemory-policy allkeys-lru
      --save 900 1 
      --save 300 10 
      --save 60 10000
    
    volumes:
      - redis_data:/data
    
    networks:
      - researchlab_network
    
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  # Nginx reverse proxy (optional, for multiple instances)
  nginx:
    image: nginx:alpine
    container_name: researchlab-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    
    networks:
      - researchlab_network
    
    depends_on:
      - app
    
    profiles:
      - nginx  # Only start with: docker-compose --profile nginx up

  # Prometheus monitoring (optional)
  prometheus:
    image: prom/prometheus:latest
    container_name: researchlab-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=30d'
    
    networks:
      - researchlab_network
    
    profiles:
      - monitoring

  # Grafana dashboard (optional)
  grafana:
    image: grafana/grafana:latest
    container_name: researchlab-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards
      - ./docker/grafana/provisioning:/etc/grafana/provisioning
    
    networks:
      - researchlab_network
    
    depends_on:
      - prometheus
    
    profiles:
      - monitoring

# Named volumes for data persistence
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  app_logs:
    driver: local
  app_data:
    driver: local
  nginx_logs:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

# Isolated network
networks:
  researchlab_network:
    driver: bridge
    name: researchlab_prod