version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: researchlab_postgres
    environment:
      POSTGRES_DB: researchlab
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=en_US.UTF-8 --lc-ctype=en_US.UTF-8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d researchlab"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - researchlab

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: researchlab_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - researchlab

  # ResearchLab API
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: researchlab_api
    environment:
      # Database
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: researchlab
      DB_USER: postgres
      DB_PASSWORD: postgres
      
      # Redis
      REDIS_URL: redis://redis:6379/0
      
      # App settings
      ENVIRONMENT: development
      DEBUG: true
      LOG_LEVEL: INFO
      LOG_FORMAT: console
      
      # External APIs (set these in .env.local)
      FINNHUB_API_KEY: ${FINNHUB_API_KEY:-}
      ALPHA_VANTAGE_API_KEY: ${ALPHA_VANTAGE_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - ./config:/app/config
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - researchlab
    restart: unless-stopped

  # pgAdmin for database management (optional)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: researchlab_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@researchlab.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - researchlab
    profiles:
      - tools

  # Redis Commander for Redis management (optional)
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: researchlab_redis_commander
    environment:
      REDIS_HOSTS: local:redis:6379
    ports:
      - "8081:8081"
    depends_on:
      - redis
    networks:
      - researchlab
    profiles:
      - tools

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  researchlab:
    driver: bridge
    name: researchlab_network